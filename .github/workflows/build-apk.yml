name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: capacitor-app/package-lock.json

      - name: Install ImageMagick (for icon resizing)
        run: sudo apt-get install -y imagemagick

      - name: Resize and apply app icon to all mipmap densities
        run: |
          SOURCE="frontend/assets/app-icon.jpg"

          declare -A SIZES=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
          )

          for DENSITY in "${!SIZES[@]}"; do
            SIZE=${SIZES[$DENSITY]}
            DIR="capacitor-app/android/app/src/main/res/$DENSITY"
            convert "$SOURCE" -resize "${SIZE}x${SIZE}" "$DIR/ic_launcher.png"
            convert "$SOURCE" -resize "${SIZE}x${SIZE}" "$DIR/ic_launcher_round.png"
            convert "$SOURCE" -resize "${SIZE}x${SIZE}" "$DIR/ic_launcher_foreground.png"
          done
          echo "✅ All icons applied!"

      - name: Install Capacitor dependencies
        working-directory: capacitor-app
        run: npm ci

      - name: Sync Capacitor Android
        working-directory: capacitor-app
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: capacitor-app/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: capacitor-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk \
             DEV-FlyAshBricks.apk
          echo "✅ APK ready: DEV-FlyAshBricks.apk"
          ls -lh DEV-FlyAshBricks.apk

      # Upload as artifact (always available in Actions tab)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEV-FlyAshBricks-APK
          path: DEV-FlyAshBricks.apk
          retention-days: 90

      # Create/update GitHub Release so website download button works
      - name: Delete existing latest release (if any)
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "DEV Fly Ash Bricks — Latest APK"
          body: |
            ## 📱 DEV Fly Ash Bricks — Android App

            **Auto-built from latest code** on ${{ github.event.head_commit.timestamp }}

            ### How to Install:
            1. Download `DEV-FlyAshBricks.apk` below
            2. On your phone: Settings → Install unknown apps → Allow
            3. Tap the downloaded file to install

            ---
            *Built with ❤️ by Shivam Dansena · DEV Fly Ash Bricks ERP*
          files: DEV-FlyAshBricks.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
