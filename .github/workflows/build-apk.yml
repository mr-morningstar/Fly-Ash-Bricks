name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17 (required for modern Android builds)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Setup Node.js for Capacitor sync
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: capacitor-app/package-lock.json

      # 4. Install Capacitor dependencies
      - name: Install Capacitor dependencies
        working-directory: capacitor-app
        run: npm ci

      # 5. Sync web assets into Android project
      - name: Sync Capacitor Android
        working-directory: capacitor-app
        run: npx cap sync android

      # 6. Grant Gradle execute permission
      - name: Make gradlew executable
        working-directory: capacitor-app/android
        run: chmod +x gradlew

      # 7. Build debug APK
      - name: Build Debug APK
        working-directory: capacitor-app/android
        run: ./gradlew assembleDebug --no-daemon

      # 8. Upload APK as downloadable artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEV-FlyAshBricks-debug-APK
          path: capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 9. Show build result
      - name: Build complete
        run: |
          echo "✅ APK built successfully!"
          echo "📱 Download from: Actions tab → This workflow run → Artifacts"
          ls -lh capacitor-app/android/app/build/outputs/apk/debug/
