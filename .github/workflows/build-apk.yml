name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: capacitor-app/package-lock.json

      - name: Install ImageMagick (for icon resizing)
        run: sudo apt-get install -y imagemagick

      - name: Resize and apply app icon to all mipmap densities
        run: |
          SOURCE="frontend/assets/app-icon.jpg"

          # Android icon sizes per density
          declare -A SIZES=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
          )

          for DENSITY in "${!SIZES[@]}"; do
            SIZE=${SIZES[$DENSITY]}
            DIR="capacitor-app/android/app/src/main/res/$DENSITY"
            echo "Resizing to ${SIZE}x${SIZE} → $DENSITY"
            convert "$SOURCE" -resize "${SIZE}x${SIZE}" "$DIR/ic_launcher.png"
            convert "$SOURCE" -resize "${SIZE}x${SIZE}" "$DIR/ic_launcher_round.png"
            convert "$SOURCE" -resize "${SIZE}x${SIZE}" "$DIR/ic_launcher_foreground.png"
          done

          echo "✅ All icons applied!"

      - name: Install Capacitor dependencies
        working-directory: capacitor-app
        run: npm ci

      - name: Sync Capacitor Android
        working-directory: capacitor-app
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: capacitor-app/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: capacitor-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEV-FlyAshBricks-APK
          path: capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build summary
        run: |
          echo "✅ APK built with DEV Fly Ash Bricks icon!"
          ls -lh capacitor-app/android/app/build/outputs/apk/debug/
