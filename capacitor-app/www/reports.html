<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DEV BRICKS - Reports</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/splash.js"></script><script src="js/auth.js"></script>
</head>
<body class="bg-surface-50 dark:bg-surface-950 text-surface-800 dark:text-surface-200">
  <div id="layout-wrapper"></div>

  <!-- Main Content Template -->
  <template id="page-template">
    <div class="flex flex-col gap-6 max-w-5xl mx-auto">
      
      <!-- Header Actions -->
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
          <h1 class="text-3xl font-black tracking-tight">Data Reports</h1>
          <p class="text-surface-500 dark:text-surface-400 mt-1">Generate and download CSV reports based on date ranges.</p>
        </div>
      </div>

      <!-- Report Generator Card -->
      <div class="bg-white dark:bg-surface-900 rounded-2xl p-6 border border-surface-200 dark:border-surface-800 shadow-sm">
        <form id="report-form" onsubmit="ReportsModule.generateReport(event)" class="flex flex-col gap-6">
          
          <div class="grid md:grid-cols-3 gap-6">
            <div class="md:col-span-1">
              <label class="block text-sm font-bold text-surface-500 mb-2">Report Type</label>
              <select name="type" required class="w-full px-4 py-3 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-xl font-medium focus:ring-2 focus:ring-brand-500 outline-none">
                <option value="production">Daily Production Log</option>
                <option value="attendance">Worker Attendance Log</option>
                <option value="billing">Billing & Invoices Log</option>
                <option value="inventory-consumption">Material Inward Log</option>
                <option value="trip-summary">Fleet Deliveries Log</option>
              </select>
            </div>

            <div class="md:col-span-2 grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-bold text-surface-500 mb-2">From Date</label>
                <input type="date" name="from" id="date-from" required class="w-full px-4 py-3 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-xl font-medium focus:ring-2 focus:ring-brand-500 outline-none">
              </div>
              <div>
                <label class="block text-sm font-bold text-surface-500 mb-2">To Date</label>
                <input type="date" name="to" id="date-to" required class="w-full px-4 py-3 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-xl font-medium focus:ring-2 focus:ring-brand-500 outline-none">
              </div>
            </div>
          </div>

          <div class="flex flex-col md:flex-row justify-between items-center pt-4 border-t border-surface-100 dark:border-surface-800 gap-4">
            <p class="text-xs text-surface-400">Files will be downloaded in CSV format, compatible with Microsoft Excel.</p>
            <button type="submit" id="generate-btn" class="w-full md:w-auto px-8 py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold transition-all transform active:scale-95 shadow-lg shadow-brand-500/30 flex items-center justify-center gap-2">
              <span>Generate CSV</span>
            </button>
          </div>

        </form>
      </div>

    </div>
  </template>

  <script src="js/config.js"></script><script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
