<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | DEV Fly Ash Bricks ERP</title>
  <meta name="description" content="Set a new password for DEV Fly Ash Bricks ERP.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');

    .login-bg {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #070e14 0%, #0d1f1a 40%, #091419 70%, #070e14 100%);
    }

    .login-grid {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(13,148,136,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(13,148,136,0.05) 1px, transparent 1px);
      background-size: 44px 44px;
      animation: grid-move 20s linear infinite;
    }
    @keyframes grid-move {
      0%   { transform: translateY(0); }
      100% { transform: translateY(44px); }
    }

    .glow-tl {
      position: fixed; top: -150px; left: -150px;
      width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle, rgba(13,148,136,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .glow-br {
      position: fixed; bottom: -100px; right: -100px;
      width: 400px; height: 400px; border-radius: 50%;
      background: radial-gradient(circle, rgba(20,184,166,0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    .login-card {
      background: rgba(9, 20, 25, 0.88);
      border: 1px solid rgba(13, 148, 136, 0.25);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 24px;
      box-shadow:
        0 0 0 1px rgba(13,148,136,0.1) inset,
        0 32px 64px rgba(0,0,0,0.7),
        0 0 60px rgba(13,148,136,0.08);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #14b8a6, transparent);
    }

    .erp-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(98, 120, 137, 0.9);
      margin-bottom: 8px;
    }

    .erp-input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(6, 14, 18, 0.7);
      border: 1px solid rgba(13, 148, 136, 0.25);
      border-radius: 12px;
      color: #f0fdfa;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }
    .erp-input:focus {
      border-color: #14b8a6;
      box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.15);
      background: rgba(6, 14, 18, 0.9);
    }

    .erp-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(13, 148, 136, 0.35);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .erp-btn:hover {
      background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(20, 184, 166, 0.45);
    }
    .erp-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    #error-msg {
      display: none;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12px;
      margin-bottom: 16px;
    }

    #success-msg {
      display: none;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: center;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 font-sans text-surface-200">
  <div class="login-bg"></div>
  <div class="login-grid"></div>
  <div class="glow-tl"></div>
  <div class="glow-br"></div>

  <div class="w-full max-w-md relative z-10">
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-3 group mb-2">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-brand-500/20 to-brand-600/30 border border-brand-500/30 flex items-center justify-center text-2xl shadow-lg shadow-brand-500/20 group-hover:scale-105 transition-all">
          🧱
        </div>
        <div class="text-left">
          <div class="font-black text-xl tracking-tight text-white uppercase leading-none">DEV Fly Ash</div>
          <div class="text-[10px] text-brand-400 font-extrabold uppercase tracking-widest mt-1">Bricks ERP</div>
        </div>
      </a>
      <p class="text-xs text-surface-400 font-medium">Sondka, Kharsia · Industrial Management</p>
    </div>

    <!-- Main Card -->
    <div class="login-card p-8">
      <div class="mb-6 text-center">
        <h2 class="text-xl font-black text-white">Reset Password 🔐</h2>
        <p class="text-xs text-surface-400 mt-1">Create a new secure password for your account</p>
      </div>

      <div id="error-msg">⚠️ <span id="error-text">Error message</span></div>
      <div id="success-msg">
        <div class="text-3xl mb-2">✅</div>
        <div class="font-bold text-white mb-1">Password Changed Successfully!</div>
        <div class="text-xs text-emerald-200" id="success-text">Redirecting to login page in 3 seconds...</div>
      </div>

      <form id="reset-form" style="display:flex;flex-direction:column;gap:18px;">
        <div>
          <label class="erp-label" for="password">New Password</label>
          <div style="position:relative;display:flex;align-items:center;">
            <input class="erp-input" type="password" id="password" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password" style="padding-right:48px;">
            <button type="button" onclick="togglePass('password', this)" style="position:absolute;right:12px;background:none;border:none;cursor:pointer;font-size:18px;line-height:1;padding:4px;color:#14b8a6;opacity:0.85;">
              👁️
            </button>
          </div>
        </div>

        <div>
          <label class="erp-label" for="confirm-password">Confirm New Password</label>
          <div style="position:relative;display:flex;align-items:center;">
            <input class="erp-input" type="password" id="confirm-password" required minlength="6" placeholder="Re-enter new password" autocomplete="new-password" style="padding-right:48px;">
            <button type="button" onclick="togglePass('confirm-password', this)" style="position:absolute;right:12px;background:none;border:none;cursor:pointer;font-size:18px;line-height:1;padding:4px;color:#14b8a6;opacity:0.85;">
              👁️
            </button>
          </div>
        </div>

        <button type="submit" class="erp-btn" id="submit-btn" style="margin-top:8px;">
          Set New Password →
        </button>
      </form>

      <div style="margin-top:24px;text-align:center;">
        <a href="login.html" class="text-xs font-bold text-brand-400 hover:text-brand-300 transition-colors">
          ← Back to Login
        </a>
      </div>

      <div style="margin-top:24px;padding-top:16px;border-top:1px solid rgba(13,148,136,0.15);text-align:center;">
        <span style="font-size:10px;color:rgba(98,120,137,0.7);font-weight:600;letter-spacing:0.5px;">
          Developed by <span style="color:#2dd4bf;font-weight:700;">Shivam Dansena</span> · Enterprise ERP
        </span>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    function togglePass(inputId, btn) {
      const el = document.getElementById(inputId);
      if (!el) return;
      if (el.type === 'password') {
        el.type = 'text';
        btn.textContent = '🙈';
      } else {
        el.type = 'password';
        btn.textContent = '👁️';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const form = document.getElementById('reset-form');
      const submitBtn = document.getElementById('submit-btn');
      const errorDiv = document.getElementById('error-msg');
      const errorText = document.getElementById('error-text');
      const successDiv = document.getElementById('success-msg');

      if (!token) {
        errorText.textContent = 'Missing or invalid password reset link. Please request a new link from the login page.';
        errorDiv.style.display = 'block';
        submitBtn.disabled = true;
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        errorDiv.style.display = 'none';

        if (password.length < 6) {
          errorText.textContent = 'Password must be at least 6 characters long.';
          errorDiv.style.display = 'block';
          return;
        }

        if (password !== confirmPassword) {
          errorText.textContent = 'Passwords do not match. Please verify and try again.';
          errorDiv.style.display = 'block';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Updating Password...';

        try {
          const res = await apiFetch(`/auth/reset-password/${token}`, {
            method: 'PUT',
            body: JSON.stringify({ password })
          });

          form.style.display = 'none';
          successDiv.style.display = 'block';

          let countdown = 3;
          const interval = setInterval(() => {
            countdown--;
            const st = document.getElementById('success-text');
            if (st) st.textContent = `Redirecting to login in ${countdown} seconds...`;
            if (countdown <= 0) {
              clearInterval(interval);
              window.location.href = 'login.html';
            }
          }, 1000);
        } catch (err) {
          errorText.textContent = err.message || 'The reset link is invalid or has expired. Please request a new link.';
          errorDiv.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Set New Password →';
        }
      });
    });
  </script>
</body>
</html>
