<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>User & Role Management | DEV Fly Ash Bricks ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/splash.js"></script>
  <script src="js/auth.js"></script>
</head>
<body class="bg-surface-50 dark:bg-surface-950 text-surface-800 dark:text-surface-200 min-h-screen">
  <div id="layout-wrapper"></div>

  <template id="page-template">
    <div class="flex flex-col gap-6 max-w-6xl mx-auto pb-12">
      <!-- Top Title & Global Action -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-surface-200 dark:border-surface-800 pb-4">
        <div>
          <h1 class="text-2xl md:text-3xl font-black tracking-tight text-surface-900 dark:text-surface-50">Access Control & Roles</h1>
          <p class="text-xs md:text-sm text-surface-500 dark:text-surface-400 mt-0.5">Manage user credentials, assign roles, and customize fine-grained ERP permissions.</p>
        </div>
        <button id="top-action-btn" onclick="UsersModule.openCreateModal()" class="w-full sm:w-auto px-5 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold text-sm transition-all shadow-lg shadow-brand-500/25 flex items-center justify-center gap-2">
          + New User
        </button>
      </div>

      <!-- Navigation Tabs -->
      <div class="flex items-center gap-2 p-1.5 bg-surface-200/60 dark:bg-surface-900 border border-surface-300 dark:border-surface-800 rounded-2xl w-fit">
        <button id="tab-users-btn" onclick="UsersModule.switchTab('users')" class="px-5 py-2 rounded-xl text-xs font-bold transition-all bg-brand-600 text-white shadow-md flex items-center gap-2">
          <span>👥</span> User Accounts
        </button>
        <button id="tab-roles-btn" onclick="UsersModule.switchTab('roles')" class="px-5 py-2 rounded-xl text-xs font-bold transition-all text-surface-500 dark:text-surface-400 hover:text-surface-900 dark:hover:text-surface-200 flex items-center gap-2">
          <span>🛡️</span> Roles & Permissions
        </button>
      </div>

      <!-- VIEW 1: USERS LIST -->
      <div id="users-view" class="flex flex-col gap-6">
        <div id="table-container"></div>
        <div id="pagination-container"></div>
      </div>

      <!-- VIEW 2: ROLES & PERMISSIONS GRID -->
      <div id="roles-view" class="hidden flex flex-col gap-6">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 bg-brand-500/5 dark:bg-brand-900/10 border border-brand-500/20 rounded-2xl p-4">
          <div class="flex items-center gap-3">
            <span class="text-2xl">🛡️</span>
            <div>
              <div class="font-bold text-sm text-surface-900 dark:text-surface-100">Role-Based Access Control (RBAC)</div>
              <div class="text-xs text-surface-500 dark:text-surface-400">Click <strong class="text-brand-400">"Edit Name & Permissions"</strong> on any role to change its name, description, or toggle allowed modules.</div>
            </div>
          </div>
          <button onclick="UsersModule.openCreateRoleModal()" class="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold rounded-xl transition-all shadow-md">
            + Create Custom Role
          </button>
        </div>

        <div id="roles-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </div>
    </div>

    <!-- MODAL: CREATE USER -->
    <div id="create-user-modal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
      <div class="bg-surface-50 dark:bg-surface-900 border border-surface-200 dark:border-surface-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between pb-4 border-b border-surface-200 dark:border-surface-800 mb-5">
          <h3 class="text-lg font-black text-surface-900 dark:text-surface-50 flex items-center gap-2">
            <span>👤</span> Create New ERP User
          </h3>
          <button onclick="Components.closeModal('create-user-modal')" class="text-surface-400 hover:text-surface-200 p-1.5 rounded-lg text-lg">✕</button>
        </div>

        <form id="create-user-form" onsubmit="UsersModule.submitCreate(event)" class="flex flex-col gap-4">
          <div>
            <label class="block text-xs font-bold text-surface-500 dark:text-surface-400 uppercase tracking-wider mb-1">Full Name</label>
            <input type="text" name="name" required placeholder="e.g. Rahul Sharma" class="w-full px-3.5 py-2.5 bg-white dark:bg-surface-950 border border-surface-300 dark:border-surface-700 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none">
          </div>

          <div>
            <label class="block text-xs font-bold text-surface-500 dark:text-surface-400 uppercase tracking-wider mb-1">Email Address</label>
            <input type="email" name="email" required placeholder="rahul@example.com" class="w-full px-3.5 py-2.5 bg-white dark:bg-surface-950 border border-surface-300 dark:border-surface-700 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none">
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-surface-500 dark:text-surface-400 uppercase tracking-wider mb-1">Password</label>
              <input type="password" name="password" required minlength="6" placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-white dark:bg-surface-950 border border-surface-300 dark:border-surface-700 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-surface-500 dark:text-surface-400 uppercase tracking-wider mb-1">Assigned Role</label>
              <select name="roleId" id="u-role-select" required class="w-full px-3.5 py-2.5 bg-white dark:bg-surface-950 border border-surface-300 dark:border-surface-700 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none font-semibold">
                <option value="">Select Role</option>
              </select>
            </div>
          </div>

          <div class="pt-4 flex gap-3">
            <button type="button" onclick="Components.closeModal('create-user-modal')" class="flex-1 py-3 bg-surface-200 dark:bg-surface-800 text-surface-700 dark:text-surface-300 rounded-xl font-bold text-sm">Cancel</button>
            <button type="submit" class="flex-1 py-3 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold text-sm shadow-lg shadow-brand-500/30">Create Account</button>
          </div>
        </form>
      </div>
    </div>

    <!-- MODAL: EDIT USER -->
    <div id="edit-user-modal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
      <div class="bg-surface-50 dark:bg-surface-900 border border-surface-200 dark:border-surface-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between pb-4 border-b border-surface-200 dark:border-surface-800 mb-5">
          <h3 class="text-lg font-black text-surface-900 dark:text-surface-50 flex items-center gap-2">
            <span>✏️</span> Edit User Account
          </h3>
          <button onclick="Components.closeModal('edit-user-modal')" class="text-surface-400 hover:text-surface-200 p-1.5 rounded-lg text-lg">✕</button>
        </div>

        <form id="edit-user-form" onsubmit="UsersModule.submitEditUser(event)" class="flex flex-col gap-4">
          <div>
            <label class="block text-xs font-bold text-surface-500 dark:text-surface-400 uppercase tracking-wider mb-1">Full Name</label>
            <input type="text" name="name" required class="w-full px-3.5 py-2.5 bg-white dark:bg-surface-950 border border-surface-300 dark:border-surface-700 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none">
          </div>

          <div>
            <label class="block text-xs font-bold text-surface-500 dark:text-surface-400 uppercase tracking-wider mb-1">Email Address</label>
            <input type="email" name="email" required class="w-full px-3.5 py-2.5 bg-white dark:bg-surface-950 border border-surface-300 dark:border-surface-700 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none">
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-surface-500 dark:text-surface-400 uppercase tracking-wider mb-1">Assigned Role</label>
              <select name="roleId" id="edit-u-role-select" required class="w-full px-3.5 py-2.5 bg-white dark:bg-surface-950 border border-surface-300 dark:border-surface-700 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none font-semibold">
                <option value="">Select Role</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-surface-500 dark:text-surface-400 uppercase tracking-wider mb-1">Status</label>
              <select name="isActive" class="w-full px-3.5 py-2.5 bg-white dark:bg-surface-950 border border-surface-300 dark:border-surface-700 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none font-semibold">
                <option value="true">Active (Access Allowed)</option>
                <option value="false">Inactive (Access Blocked)</option>
              </select>
            </div>
          </div>

          <div class="pt-4 flex gap-3">
            <button type="button" onclick="Components.closeModal('edit-user-modal')" class="flex-1 py-3 bg-surface-200 dark:bg-surface-800 text-surface-700 dark:text-surface-300 rounded-xl font-bold text-sm">Cancel</button>
            <button type="submit" class="flex-1 py-3 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold text-sm shadow-lg shadow-brand-500/30">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

    <!-- MODAL: CREATE / EDIT ROLE & PERMISSIONS -->
    <div id="role-modal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
      <div class="bg-surface-50 dark:bg-surface-900 border border-surface-200 dark:border-surface-800 rounded-2xl max-w-2xl w-full p-6 shadow-2xl relative max-h-[92vh] overflow-y-auto">
        <div class="flex items-center justify-between pb-4 border-b border-surface-200 dark:border-surface-800 mb-5">
          <h3 id="role-modal-title" class="text-lg font-black text-surface-900 dark:text-surface-50 flex items-center gap-2">
            <span>🛡️</span> Role Configuration
          </h3>
          <button onclick="Components.closeModal('role-modal')" class="text-surface-400 hover:text-surface-200 p-1.5 rounded-lg text-lg">✕</button>
        </div>

        <form id="role-form" onsubmit="UsersModule.submitRole(event)" class="flex flex-col gap-5">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-surface-500 dark:text-surface-400 uppercase tracking-wider mb-1">Role Name</label>
              <input type="text" name="name" required placeholder="e.g. Operations Lead" class="w-full px-3.5 py-2.5 bg-white dark:bg-surface-950 border border-surface-300 dark:border-surface-700 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-surface-500 dark:text-surface-400 uppercase tracking-wider mb-1">Description</label>
              <input type="text" name="description" placeholder="Brief summary of duties" class="w-full px-3.5 py-2.5 bg-white dark:bg-surface-950 border border-surface-300 dark:border-surface-700 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="block text-xs font-bold text-surface-500 dark:text-surface-400 uppercase tracking-wider">Configure Permissions</label>
              <div class="flex gap-2">
                <button type="button" onclick="UsersModule.toggleAllPerms('create-role-perm', true)" class="text-[11px] font-bold px-2 py-1 bg-brand-500/10 text-brand-400 rounded-lg hover:bg-brand-500/20">Select All</button>
                <button type="button" onclick="UsersModule.toggleAllPerms('create-role-perm', false)" class="text-[11px] font-bold px-2 py-1 bg-surface-200 dark:bg-surface-800 text-surface-400 rounded-lg hover:bg-surface-700">Clear All</button>
              </div>
            </div>

            <div id="create-role-perm-container" class="flex flex-col gap-3 max-h-80 overflow-y-auto pr-1"></div>
          </div>

          <div class="pt-4 flex gap-3 border-t border-surface-200 dark:border-surface-800">
            <button type="button" onclick="Components.closeModal('role-modal')" class="flex-1 py-3 bg-surface-200 dark:bg-surface-800 text-surface-700 dark:text-surface-300 rounded-xl font-bold text-sm">Cancel</button>
            <button type="submit" class="flex-1 py-3 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold text-sm shadow-lg shadow-brand-500/30">Save Role</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
