<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Billing | DEV Fly Ash Bricks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/splash.js"></script>
  <script src="js/auth.js"></script>
</head>
<body class="bg-surface-50 dark:bg-surface-950 text-surface-800 dark:text-surface-200">
  <div id="layout-wrapper"></div>

  <template id="page-template">
    <div class="flex flex-col gap-6 max-w-7xl mx-auto">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
          <h1 class="text-3xl font-black tracking-tight">Billing & Invoices</h1>
          <p class="text-surface-500 dark:text-surface-400 mt-1">Generate and manage salary bills including trip earnings.</p>
        </div>
        <button onclick="BillingModule.openGenerateModal()" class="w-full md:w-auto px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold transition-all shadow-lg shadow-brand-500/30">
          + Generate Bill
        </button>
      </div>

      <!-- Filters -->
      <div class="flex flex-wrap gap-3 p-4 bg-white dark:bg-surface-900 rounded-xl border border-surface-200 dark:border-surface-800 shadow-sm">
        <select id="bill-status-filter" onchange="BillingModule.applyFilter()" class="px-3 py-2 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-lg text-sm">
          <option value="">All Status</option>
          <option value="draft">Draft</option>
          <option value="final">Final</option>
          <option value="paid">Paid</option>
        </select>
        <input type="date" id="bill-start" class="px-3 py-2 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-lg text-sm">
        <input type="date" id="bill-end" class="px-3 py-2 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-lg text-sm">
        <button onclick="BillingModule.applyFilter()" class="px-4 py-2 bg-surface-800 dark:bg-surface-700 text-white rounded-lg hover:bg-surface-700 text-sm font-bold">Apply</button>
      </div>

      <div id="table-container"></div>
      <div id="pagination-container"></div>
    </div>
    <div id="generate-modal-wrap"></div>
    <div id="bill-detail-modal-wrap"></div>
  </template>

  <script src="js/config.js"></script><script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/billing.js"></script>
</body>
</html>
