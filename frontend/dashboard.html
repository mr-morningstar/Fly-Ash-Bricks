<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dashboard | DEV Fly Ash Bricks</title>
  <meta name="description" content="DEV Fly Ash Bricks ERP — Real-time dashboard with production, attendance, billing and inventory overview.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/splash.js"></script>
  <script src="js/auth.js"></script>
</head>
<body class="bg-surface-50 dark:bg-surface-950 text-surface-800 dark:text-surface-200 min-h-screen">
  <div id="layout-wrapper"></div>

  <template id="page-template">
    <div class="flex flex-col gap-6 max-w-7xl mx-auto">

      <!-- Welcome -->
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl md:text-3xl font-black tracking-tight" id="dash-greeting">Good Morning 👋</h1>
          <p class="text-surface-500 dark:text-surface-400 mt-1 text-sm" id="dash-date"></p>
        </div>
        <button onclick="DashboardModule.refresh()" class="px-4 py-2 bg-surface-200 dark:bg-surface-800 rounded-xl text-sm font-bold hover:bg-surface-300 dark:hover:bg-surface-700 transition-colors">
          🔄 Refresh
        </button>
      </div>

      <!-- KPI Cards -->
      <div id="kpi-cards" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
        <!-- Rendered by JS -->
      </div>

      <!-- Charts Row -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 p-6 rounded-2xl bg-white dark:bg-surface-900 border border-surface-200 dark:border-surface-800 shadow-sm card-hover">
          <h3 class="font-bold text-base text-surface-700 dark:text-surface-200 mb-4">📈 30-Day Production Trend</h3>
          <div class="relative h-56 md:h-72">
            <canvas id="trend-chart"></canvas>
          </div>
        </div>
        <div class="p-6 rounded-2xl bg-white dark:bg-surface-900 border border-surface-200 dark:border-surface-800 shadow-sm card-hover">
          <h3 class="font-bold text-base text-surface-700 dark:text-surface-200 mb-4">👥 Group Comparison</h3>
          <div class="relative h-56 md:h-72">
            <canvas id="group-chart"></canvas>
          </div>
        </div>
      </div>

      <!-- Bottom Row: Recent Bills + Recent Trips + Low Stock -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- Recent Bills -->
        <div class="p-5 rounded-2xl bg-white dark:bg-surface-900 border border-surface-200 dark:border-surface-800 shadow-sm">
          <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-sm uppercase tracking-wider text-surface-500">Recent Bills</h3>
            <a href="billing.html" class="text-xs text-brand-600 font-bold">View All →</a>
          </div>
          <div id="recent-bills" class="flex flex-col gap-2"></div>
        </div>

        <!-- Recent Trips -->
        <div class="p-5 rounded-2xl bg-white dark:bg-surface-900 border border-surface-200 dark:border-surface-800 shadow-sm">
          <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-sm uppercase tracking-wider text-surface-500">Recent Deliveries</h3>
            <a href="fleet.html" class="text-xs text-brand-600 font-bold">View All →</a>
          </div>
          <div id="recent-trips" class="flex flex-col gap-2"></div>
        </div>

        <!-- Low Stock Alerts -->
        <div class="p-5 rounded-2xl bg-white dark:bg-surface-900 border border-surface-200 dark:border-surface-800 shadow-sm">
          <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-sm uppercase tracking-wider text-surface-500">⚠️ Low Stock</h3>
            <a href="inventory.html" class="text-xs text-brand-600 font-bold">Manage →</a>
          </div>
          <div id="low-stock" class="flex flex-col gap-2"></div>
        </div>
      </div>

    </div>
  </template>

  <script src="js/config.js"></script><script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
