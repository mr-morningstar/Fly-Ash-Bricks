<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Drivers Registry | DEV Fly Ash Bricks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/splash.js"></script>
  <script src="js/auth.js"></script>
</head>
<body class="bg-surface-50 dark:bg-surface-950 text-surface-800 dark:text-surface-200">
  <div id="layout-wrapper"></div>

  <!-- Main Content Template -->
  <template id="page-template">
    <div class="flex flex-col gap-6 max-w-7xl mx-auto">
      
      <!-- Header Actions -->
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
          <h1 class="text-3xl font-black tracking-tight">Drivers Registry</h1>
          <p class="text-surface-500 dark:text-surface-400 mt-1">
            Manage delivery drivers, vehicle allocations, default trip rates, and helper rates.
          </p>
        </div>
        <div class="flex gap-3 w-full md:w-auto">
          <button onclick="DriversModule.openDriverModal()" 
                  class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold transition-all transform active:scale-95 shadow-lg shadow-brand-500/30">
            ➕ Add New Driver
          </button>
        </div>
      </div>

      <!-- Stats Cards -->
      <div id="driver-stats-container" class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <!-- Rendered by JS -->
      </div>

      <!-- Filter Bar -->
      <div id="driver-filter-container"></div>

      <!-- Table Container -->
      <div id="driver-table-container"></div>
      <div id="driver-pagination-container"></div>
    </div>

    <!-- Create / Edit Driver Modal Container -->
    <div id="driver-modal-container"></div>
  </template>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/drivers.js"></script>
</body>
</html>
