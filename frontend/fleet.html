<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DEV BRICKS - Fleet Trips</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/splash.js"></script><script src="js/auth.js"></script>
</head>
<body class="bg-surface-50 dark:bg-surface-950 text-surface-800 dark:text-surface-200">
  <div id="layout-wrapper"></div>

  <!-- Main Content Template -->
  <template id="page-template">
    <div class="flex flex-col gap-6 max-w-7xl mx-auto">
      
      <!-- Header Actions -->
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
          <h1 class="text-3xl font-black tracking-tight">Fleet Deliveries</h1>
          <p class="text-surface-500 dark:text-surface-400 mt-1">Manage brick delivery trips, drivers, and loading helpers.</p>
        </div>
        <div class="flex gap-3 w-full md:w-auto">
          <button onclick="FleetModule.openImportModal()" class="flex-1 md:flex-none px-4 py-2 bg-surface-200 dark:bg-surface-800 text-surface-700 dark:text-surface-300 rounded-xl font-bold hover:bg-surface-300 dark:hover:bg-surface-700 transition-colors shadow-sm">
            📥 Import
          </button>
          <button onclick="FleetModule.openTripModal()" class="flex-1 md:flex-none px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold transition-all transform active:scale-95 shadow-lg shadow-brand-500/30">
            + New Trip
          </button>
        </div>
      </div>

      <!-- Stats -->
      <div id="stats-container" class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <!-- Rendered by JS -->
      </div>

      <!-- Filter Bar -->
      <div id="filter-container"></div>

      <!-- Table Container -->
      <div id="table-container"></div>
      <div id="pagination-container"></div>
    </div>

    <!-- Trip Modal -->
    <div id="trip-modal-container"></div>

    <!-- Import Modal -->
    <div id="import-modal-container"></div>
  </template>

  <script src="js/config.js"></script><script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/fleet.js"></script>
</body>
</html>
