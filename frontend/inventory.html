<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DEV BRICKS - Inventory Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/splash.js"></script><script src="js/auth.js"></script>
</head>
<body class="bg-surface-50 dark:bg-surface-950 text-surface-800 dark:text-surface-200">
  <div id="layout-wrapper"></div>

  <!-- Main Content Template -->
  <template id="page-template">
    <div class="flex flex-col gap-6 max-w-7xl mx-auto">
      
      <!-- Header Actions -->
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
          <h1 class="text-3xl font-black tracking-tight">Inventory</h1>
          <p class="text-surface-500 dark:text-surface-400 mt-1">Manage raw materials, stock levels, and inward receipts.</p>
        </div>
        <div class="flex gap-3 w-full md:w-auto">
          <button onclick="InventoryModule.openMaterialInwardModal()" class="flex-1 md:flex-none px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold transition-all shadow-sm">
            🚚 Log Inward
          </button>
          <button onclick="InventoryModule.openItemModal()" class="flex-1 md:flex-none px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold transition-all transform active:scale-95 shadow-lg shadow-brand-500/30">
            + New Material
          </button>
        </div>
      </div>

      <!-- Stats -->
      <div id="stats-container" class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <!-- Rendered by JS -->
      </div>

      <!-- Tabs -->
      <div class="flex border-b border-surface-200 dark:border-surface-800">
        <button onclick="InventoryModule.switchTab('catalog')" id="tab-catalog" class="px-4 py-3 font-bold border-b-2 border-brand-500 text-brand-600 dark:text-brand-400">Material Catalog</button>
        <button onclick="InventoryModule.switchTab('inward')" id="tab-inward" class="px-4 py-3 font-bold border-b-2 border-transparent text-surface-500 hover:text-surface-700 dark:hover:text-surface-300">Inward Receipts</button>
      </div>

      <!-- Catalog View -->
      <div id="view-catalog" class="flex flex-col gap-4">
        <div id="catalog-filter-container"></div>
        <!-- Table Container -->
        <div id="catalog-table-container"></div>
        <div id="catalog-pagination"></div>
      </div>

      <!-- Inward Receipts View -->
      <div id="view-inward" class="hidden flex flex-col gap-4">
        <div id="inward-filter-container"></div>
        <div id="inward-table-container"></div>
        <div id="inward-pagination"></div>
      </div>
      
    </div>

    <!-- Modals -->
    <div id="item-modal-container"></div>
    <div id="inward-modal-container"></div>
  </template>

  <script src="js/config.js"></script><script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/inventory.js"></script>
</body>
</html>
