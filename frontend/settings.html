<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Settings | DEV Fly Ash Bricks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/splash.js"></script>
  <script src="js/auth.js"></script>
</head>
<body class="bg-surface-50 dark:bg-surface-950 text-surface-800 dark:text-surface-200">
  <div id="layout-wrapper"></div>

  <template id="page-template">
    <div class="flex flex-col gap-8 max-w-4xl mx-auto">
      <div>
        <h1 class="text-3xl font-black tracking-tight">Settings</h1>
        <p class="text-surface-500 dark:text-surface-400 mt-1">Configure company details, rates, shift timings, and thresholds.</p>
      </div>

      <!-- Company Info -->
      <div class="bg-white dark:bg-surface-900 rounded-2xl p-6 border border-surface-200 dark:border-surface-800 shadow-sm">
        <h2 class="font-black text-lg mb-6 flex items-center gap-2">🏢 Company Information</h2>
        <form id="settings-form" onsubmit="SettingsModule.save(event)" class="flex flex-col gap-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-surface-500 mb-1">Company Name</label>
              <input type="text" name="companyName" id="s-companyName" class="w-full px-3 py-2 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-surface-500 mb-1">Contact Phone</label>
              <input type="text" name="phone" id="s-phone" class="w-full px-3 py-2 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-surface-500 mb-1">Email</label>
              <input type="email" name="email" id="s-email" class="w-full px-3 py-2 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-surface-500 mb-1">Address</label>
              <input type="text" name="address" id="s-address" class="w-full px-3 py-2 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
          </div>

          <hr class="border-surface-100 dark:border-surface-800 my-2">
          <h3 class="font-bold text-sm text-surface-500 uppercase tracking-wider">Production & Form Defaults</h3>
          <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-bold text-surface-500 mb-1">Default Rate/Brick (₹)</label>
              <input type="number" step="0.01" name="defaultRatePerBrick" id="s-defaultRatePerBrick" class="w-full px-3 py-2 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-surface-500 mb-1">Low Stock Alert Threshold</label>
              <input type="number" name="lowStockAlertThreshold" id="s-lowStockAlertThreshold" class="w-full px-3 py-2 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-surface-500 mb-1">Financial Year Start</label>
              <select name="financialYearStartMonth" id="s-fyMonth" class="w-full px-3 py-2 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                <option value="1">January</option>
                <option value="4">April</option>
                <option value="7">July</option>
                <option value="10">October</option>
              </select>
            </div>
            <div class="col-span-2 md:col-span-3 grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-surface-500 mb-1">Material Units (comma separated)</label>
                <input type="text" name="materialUnits" id="s-materialUnits" placeholder="tons, kg, bags" class="w-full px-3 py-2 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none">
              </div>
              <div>
                <label class="block text-xs font-bold text-surface-500 mb-1">Production Labels (comma separated)</label>
                <input type="text" name="productionLabels" id="s-productionLabels" placeholder="Line A, Line B" class="w-full px-3 py-2 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none">
              </div>
            </div>
          </div>

          <hr class="border-surface-100 dark:border-surface-800 my-2">
          <h3 class="font-bold text-sm text-surface-500 uppercase tracking-wider">Bank Details</h3>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-surface-500 mb-1">Bank Name</label>
              <input type="text" name="bankDetails.bankName" id="s-bankName" class="w-full px-3 py-2 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-surface-500 mb-1">Account Number</label>
              <input type="text" name="bankDetails.accountNumber" id="s-accountNumber" class="w-full px-3 py-2 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-surface-500 mb-1">IFSC Code</label>
              <input type="text" name="bankDetails.ifscCode" id="s-ifscCode" class="w-full px-3 py-2 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-surface-500 mb-1">Account Holder Name</label>
              <input type="text" name="bankDetails.accountHolder" id="s-accountHolder" class="w-full px-3 py-2 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
          </div>

          <div class="flex justify-end pt-2">
            <button type="submit" class="px-8 py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold transition-all shadow-lg shadow-brand-500/30">
              💾 Save Settings
            </button>
          </div>
        </form>
      </div>

      <!-- Security & Password Management -->
      <div class="bg-white dark:bg-surface-900 rounded-2xl p-6 border border-surface-200 dark:border-surface-800 shadow-sm">
        <h2 class="font-black text-lg mb-2 flex items-center gap-2">🔒 Security & Password</h2>
        <p class="text-xs text-surface-500 dark:text-surface-400 mb-6">Update your account password to keep your ERP workspace secure.</p>
        
        <form id="settings-password-form" onsubmit="SettingsModule.changePassword(event)" class="flex flex-col gap-4 max-w-xl">
          <div>
            <label class="block text-xs font-bold text-surface-500 mb-1">Current Password</label>
            <input type="password" name="currentPassword" id="s-cur-password" required placeholder="••••••••" class="w-full px-3 py-2 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none">
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-surface-500 mb-1">New Password (min 6 chars)</label>
              <input type="password" name="newPassword" id="s-new-password" required minlength="6" placeholder="••••••••" class="w-full px-3 py-2 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-surface-500 mb-1">Confirm New Password</label>
              <input type="password" name="confirmPassword" id="s-confirm-password" required minlength="6" placeholder="••••••••" class="w-full px-3 py-2 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
          </div>
          <div class="flex justify-start pt-2">
            <button type="submit" id="s-change-pwd-btn" class="px-6 py-2.5 bg-surface-800 hover:bg-brand-600 text-white border border-surface-700 hover:border-brand-500 rounded-xl font-bold text-sm transition-all shadow-md">
              🔑 Update Password
            </button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <script src="js/config.js"></script><script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
