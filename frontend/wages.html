<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Daily Wages & Settlements | DEV Fly Ash Bricks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/splash.js"></script>
  <script src="js/auth.js"></script>
</head>
<body class="bg-surface-50 dark:bg-surface-950 text-surface-800 dark:text-surface-200">
  <div id="layout-wrapper"></div>

  <!-- Main Content Template -->
  <template id="page-template">
    <div class="flex flex-col gap-6 max-w-7xl mx-auto">
      
      <!-- Header Actions -->
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
          <h1 class="text-3xl font-black tracking-tight">Daily Wages & Settlements</h1>
          <p class="text-surface-500 dark:text-surface-400 mt-1">
            Unified daily payroll combining brick making rates, delivery driving wages, and loading/unloading helper earnings.
          </p>
        </div>
        <div class="flex gap-3 w-full md:w-auto">
          <button onclick="WagesModule.exportSummary()" 
                  class="px-4 py-2 bg-surface-200 dark:bg-surface-800 text-surface-700 dark:text-surface-300 rounded-xl font-bold hover:bg-surface-300 dark:hover:bg-surface-700 transition-colors shadow-sm text-sm">
            📄 Export Sheet
          </button>
        </div>
      </div>

      <!-- Stats Cards -->
      <div id="wages-stats-container" class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <!-- Rendered by JS -->
      </div>

      <!-- Date Filter Bar -->
      <div class="bg-white dark:bg-surface-900 border border-surface-200 dark:border-surface-800 p-4 rounded-2xl flex flex-wrap items-center justify-between gap-4 shadow-sm">
        <div class="flex flex-wrap items-center gap-3">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-surface-400 uppercase">From:</span>
            <input type="date" id="wages-start-date" 
                   class="px-3 py-1.5 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-lg text-xs font-medium">
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-surface-400 uppercase">To:</span>
            <input type="date" id="wages-end-date" 
                   class="px-3 py-1.5 bg-surface-50 dark:bg-surface-950 border border-surface-200 dark:border-surface-700 rounded-lg text-xs font-medium">
          </div>
          <button onclick="WagesModule.applyDateFilter()" 
                  class="px-4 py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-xs font-bold transition-all shadow-sm">
            Filter Dates
          </button>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="WagesModule.setFilterPreset('today')" class="px-2.5 py-1 rounded-md text-xs font-bold bg-surface-100 dark:bg-surface-800 hover:bg-surface-200 dark:hover:bg-surface-700 transition-colors">Today</button>
          <button onclick="WagesModule.setFilterPreset('week')" class="px-2.5 py-1 rounded-md text-xs font-bold bg-surface-100 dark:bg-surface-800 hover:bg-surface-200 dark:hover:bg-surface-700 transition-colors">Last 7 Days</button>
          <button onclick="WagesModule.setFilterPreset('month')" class="px-2.5 py-1 rounded-md text-xs font-bold bg-surface-100 dark:bg-surface-800 hover:bg-surface-200 dark:hover:bg-surface-700 transition-colors">This Month</button>
        </div>
      </div>

      <!-- Table Container -->
      <div id="wages-table-container"></div>
    </div>

    <!-- Day Breakdown Modal -->
    <div id="day-breakdown-modal-container"></div>
  </template>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/wages.js"></script>
</body>
</html>
